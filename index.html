<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VoltDown — 1000 Solutions to High Electricity Prices</title>
<style>
  :root {
    --bg: #0b1020;
    --bg-soft: #121a32;
    --card: #161f3d;
    --card-2: #1c2748;
    --line: #283359;
    --txt: #e8edff;
    --muted: #9aa6cf;
    --accent: #ffd54a;
    --accent-2: #4ad0ff;
    --green: #3ddc97;
    --amber: #ffb020;
    --red: #ff5c7a;
    --grey: #76819e;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
    --surface-2: #0e1530;   /* inset surfaces (subs, bars, table head) */
    --panelW: min(46vw, 560px);   /* docked detail-panel width */
  }
  :root[data-theme="light"] {
    --bg: #eef1f7;
    --bg-soft: #ffffff;
    --card: #ffffff;
    --card-2: #f5f7fc;
    --line: #d7deec;
    --txt: #16203a;
    --muted: #54607a;
    --accent: #8a6b00;
    --accent-2: #0e7fb8;
    --grey: #7a849c;
    --shadow: 0 10px 30px rgba(20,30,60,.10);
    --surface-2: #eef2fa;
  }
  /* Light-mode overrides for surfaces that hardcode dark hex values */
  [data-theme="light"] body {
    background: radial-gradient(1200px 600px at 80% -10%, #dfe9ff 0%, transparent 60%),
                radial-gradient(900px 500px at -10% 10%, #e3f3ff 0%, transparent 55%),
                var(--bg);
  }
  [data-theme="light"] .controls { background: rgba(255,255,255,.85); }
  [data-theme="light"] .bar,
  [data-theme="light"] .progress-mini { background: #e4e9f4; }
  [data-theme="light"] .sub,
  [data-theme="light"] .dsub,
  [data-theme="light"] .detail-cost > div,
  [data-theme="light"] .org { background: var(--surface-2); }
  [data-theme="light"] .detail { background: linear-gradient(180deg, #ffffff, #f5f7fc); }
  [data-theme="light"] .pill.cost { background: #fff4d6; color: #7a5c00; border-color: #e7d6a0; }
  [data-theme="light"] table.vtable thead th { background: #eef2fa; }
  [data-theme="light"] table.vtable tbody tr:hover { background: #eef3fb; }
  [data-theme="light"] table.vtable tbody tr.active { background: #e3ecfa; }
  [data-theme="light"] .tablewrap { background: #ffffff; }
  /* bright category colors are inline; darken them so they read on light bg */
  [data-theme="light"] .cat,
  [data-theme="light"] .vt-cat { filter: brightness(.62) saturate(1.5); }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 80% -10%, #1a2552 0%, transparent 60%),
                radial-gradient(900px 500px at -10% 10%, #102a3a 0%, transparent 55%),
                var(--bg);
    color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 28px 24px 10px;
    max-width: 1280px;
    margin: 0 auto;
  }
  .brand { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header { border-top: 3px solid var(--brand, transparent); }
  .domain-picker { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; }
  #domainSelect { background: var(--bg-soft); border: 1px solid var(--line); color: var(--txt); padding: 9px 12px; border-radius: 10px; font-size: 14px; max-width: 60vw; }
  #domainSelect:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
  .logo {
    width: 46px; height: 46px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #ff8a3c);
    display: grid; place-items: center; font-size: 26px;
    box-shadow: 0 6px 18px rgba(255,170,60,.35);
  }
  h1 { font-size: 26px; margin: 0; letter-spacing: .3px; }
  .tag { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .stats {
    display: grid; grid-template-columns: repeat(5, 1fr);
    gap: 12px; margin: 20px auto 0; max-width: 1280px; padding: 0 24px;
  }
  .stat {
    background: linear-gradient(180deg, var(--card), var(--bg-soft));
    border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
    box-shadow: var(--shadow);
  }
  .stat .n { font-size: 24px; font-weight: 700; }
  .stat .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
  .bar { height: 8px; border-radius: 8px; background: #0d1430; overflow: hidden; margin-top: 10px; display: flex; }
  .bar > span { display: block; height: 100%; }
  .controls {
    position: sticky; top: 0; z-index: 20;
    backdrop-filter: blur(10px);
    background: rgba(11,16,32,.78);
    border-bottom: 1px solid var(--line);
    margin-top: 18px; padding: 14px 24px;
  }
  .controls-inner {
    max-width: 1280px; margin: 0 auto;
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  }
  input[type="search"], select {
    background: var(--bg-soft); border: 1px solid var(--line); color: var(--txt);
    padding: 10px 12px; border-radius: 10px; font-size: 14px; outline: none;
  }
  input[type="search"] { flex: 1 1 280px; min-width: 200px; }
  input[type="search"]:focus, select:focus { border-color: var(--accent-2); }
  .slider-wrap { display: inline-flex; align-items: center; gap: 10px; }
  .slider-label { color: var(--muted); font-size: 13px; white-space: nowrap; }
  #costSlider { width: 220px; max-width: 46vw; accent-color: var(--accent-2); cursor: pointer; }
  #costSlider:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 4px; }
  .slider-val {
    font-size: 13px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums;
    min-width: 120px; white-space: nowrap;
  }
  .chiprow { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: var(--bg-soft); color: var(--muted);
    padding: 7px 12px; border-radius: 999px; font-size: 13px; cursor: pointer; user-select: none;
    font-family: inherit; line-height: 1.2;
  }
  .chip.active { color: #0b1020; background: var(--accent-2); border-color: var(--accent-2); font-weight: 600; }
  .chip-toggle { color: var(--accent-2); border-style: dashed; font-weight: 600; }
  .count { color: var(--muted); font-size: 13px; margin-left: auto; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  main { max-width: 1280px; margin: 18px auto 80px; padding: 0 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 16px; }
  .card {
    background: linear-gradient(180deg, var(--card), var(--card-2));
    border: 1px solid var(--line); border-radius: 16px; padding: 16px;
    box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px;
  }
  .card .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .cat {
    font-size: 11px; text-transform: uppercase; letter-spacing: .7px;
    color: var(--accent-2); font-weight: 700;
  }
  .idtag { color: var(--grey); font-size: 11px; font-variant-numeric: tabular-nums; }
  .title { font-size: 16px; font-weight: 650; line-height: 1.3; }
  .desc { color: var(--muted); font-size: 13px; line-height: 1.45; }
  .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .pill {
    font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 600;
    border: 1px solid var(--line);
  }
  .pill.impact-High { color: #0b1020; background: var(--green); border-color: var(--green); }
  .pill.impact-Medium { color: #0b1020; background: var(--amber); border-color: var(--amber); }
  .pill.impact-Low { color: var(--txt); border-color: var(--line); }
  .pill.feas-High { color: #0b1020; background: var(--accent-2); border-color: var(--accent-2); }
  .pill.feas-Medium { color: #0b1020; background: #7da7ff; border-color: #7da7ff; }
  .pill.feas-Low { color: var(--txt); border-color: var(--line); }
  .pill.cost { color: var(--accent); border-color: #4a3f10; background: #221c06; }
  .progress-mini { flex: 1 1 90px; height: 6px; border-radius: 6px; background: #0d1430; overflow: hidden; min-width: 60px; }
  .progress-mini > span { display: block; height: 100%; background: linear-gradient(90deg, var(--green), var(--accent-2)); }
  .subs { display: none; flex-direction: column; gap: 6px; margin-top: 4px; }
  .card.open .subs { display: flex; }
  .sub {
    display: flex; align-items: center; gap: 10px;
    background: #0e1530; border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; font-size: 13px;
  }
  .sub .stxt { flex: 1; }
  .sub.done .stxt { text-decoration: line-through; color: var(--grey); }
  .status-btn {
    border: none; cursor: pointer; font-size: 11px; font-weight: 700;
    padding: 4px 8px; border-radius: 7px; min-width: 92px; text-align: center;
    color: #0b1020;
  }
  .s-todo { background: var(--grey); color: #0b1020; }
  .s-doing { background: var(--amber); }
  .s-blocked { background: var(--red); }
  .s-done { background: var(--green); }
  .toggle {
    background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 9px; padding: 6px 10px; font-size: 12px; cursor: pointer;
    align-self: flex-start;
  }
  .toggle:hover { color: var(--txt); border-color: var(--accent-2); }
  .card { cursor: pointer; transition: border-color .15s, transform .05s; }
  .card:hover { border-color: var(--accent-2); }
  .card:active { transform: scale(.995); }
  .card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
  .card:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
  .chip:focus-visible, .status-btn:focus-visible, .detail-close:focus-visible,
  .reset:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent-2); outline-offset: 2px;
  }
  .cardhint { color: var(--grey); font-size: 12px; margin-top: 2px; }
  .bizline { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .bizline b { color: var(--txt); font-variant-numeric: tabular-nums; }

  .backdrop {
    position: fixed; inset: 0; background: rgba(5,8,18,.55);
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40;
  }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .detail {
    position: fixed; top: 0; right: 0; height: 100vh; width: var(--panelW); max-width: none;
    background: linear-gradient(180deg, #131c38, #0e1530);
    border-left: 1px solid var(--line); box-shadow: -20px 0 50px rgba(0,0,0,.45);
    padding: 22px 24px 40px; overflow-y: auto; z-index: 50;
    transform: translateX(100%); transition: transform .22s ease;
  }
  .detail.open { transform: translateX(0); }
  /* Docked split: when the panel is open, the page content shrinks to the left so the
     table/cards occupy the remaining width; closing the ✕ re-expands them to full width. */
  header, .stats, .controls, main { transition: margin-right .22s ease; }
  body.detail-open header, body.detail-open .stats,
  body.detail-open .controls, body.detail-open main { margin-right: var(--panelW); }
  .detail-head { display: flex; justify-content: space-between; align-items: center; }
  .detail-close {
    background: var(--bg-soft); border: 1px solid var(--line); color: var(--muted);
    width: 34px; height: 34px; border-radius: 9px; cursor: pointer; font-size: 15px;
  }
  .detail-close:hover { color: var(--txt); border-color: var(--red); }
  .detail-id { color: var(--grey); font-size: 12px; margin-top: 14px; font-variant-numeric: tabular-nums; }
  .detail-title { font-size: 22px; line-height: 1.25; margin: 4px 0 12px; }
  .detail-cost {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 16px 0 10px;
  }
  .dc-sub { font-size: 12px; color: var(--muted); font-weight: 600; }
  .detail-cost > div {
    background: #0e1530; border: 1px solid var(--line); border-radius: 12px; padding: 12px;
  }
  .dc-n { font-size: 20px; font-weight: 700; }
  .dc-l { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  .detail-prog { height: 8px; margin: 6px 0 8px; }
  .detail-sec {
    margin: 20px 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .7px;
    color: var(--accent-2); font-weight: 700;
  }
  .dsubs { display: flex; flex-direction: column; gap: 8px; }
  .dsub {
    display: flex; flex-direction: column; gap: 8px;
    background: #0e1530; border: 1px solid var(--line); border-radius: 11px; padding: 11px 12px;
  }
  .dsub-row { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
  .dsub-main { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
  .dsub-txt { font-size: 14px; }
  .dsub.done .dsub-txt { text-decoration: line-through; color: var(--grey); }
  .dsub-cost { color: var(--accent); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .steps-toggle {
    align-self: flex-start; background: none; border: none; color: var(--accent-2);
    cursor: pointer; font: inherit; font-size: 12px; padding: 0;
  }
  .steps-toggle:hover { text-decoration: underline; }
  .dsteps {
    margin: 0; padding: 6px 0 2px 22px; display: flex; flex-direction: column; gap: 5px;
    color: var(--muted); font-size: 13px; line-height: 1.4;
  }
  .dsteps li { padding-left: 2px; }
  .dsteps li::marker { color: var(--accent-2); }
  .orgs { display: flex; flex-wrap: wrap; gap: 8px; }
  .org {
    display: inline-block; text-decoration: none; font-size: 12.5px; font-weight: 600;
    color: var(--accent-2); background: #0e1530; border: 1px solid var(--line);
    padding: 6px 11px; border-radius: 999px;
  }
  .org:hover { border-color: var(--accent-2); }
  .detail-note { color: var(--grey); font-size: 12px; line-height: 1.5; margin-top: 18px; }
  /* Timeline (mini Gantt of the solution's subtasks) */
  .tl-total { color: var(--muted); font-size: 12.5px; margin: -2px 0 10px; }
  .tl-total b { color: var(--txt); }
  .timeline { display: flex; flex-direction: column; gap: 7px; }
  .tl-row { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; align-items: center; }
  .tl-label { font-size: 12.5px; color: var(--txt); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tl-track { position: relative; height: 20px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; }
  .tl-bar {
    position: absolute; top: 2px; height: 14px; min-width: 16px; border-radius: 4px;
    font-size: 10px; font-weight: 700; color: #0b1020; display: flex; align-items: center;
    justify-content: center; overflow: hidden; box-sizing: border-box;
  }
  .tl-axis { display: flex; justify-content: space-between; color: var(--grey); font-size: 11px; margin-top: 4px; }
  @media (max-width: 760px) {
    .detail { width: 100vw; }
    body.detail-open header, body.detail-open .stats,
    body.detail-open .controls, body.detail-open main { margin-right: 0; }
  }
  .viewtoggle { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .vt {
    background: var(--bg-soft); color: var(--muted); border: none; cursor: pointer;
    padding: 10px 12px; font-size: 13px; font-family: inherit;
  }
  .vt + .vt { border-left: 1px solid var(--line); }
  .vt.active { background: var(--accent-2); color: #0b1020; font-weight: 600; }
  .tablewrap { display: block; overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; }
  table.vtable { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.vtable thead th {
    text-align: left; white-space: nowrap;
    background: #0e1530; color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: .5px; padding: 10px 12px; border-bottom: 1px solid var(--line);
  }
  table.vtable td, table.vtable th[scope="row"] { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.vtable tbody tr { cursor: pointer; }
  table.vtable tbody tr:hover { background: #16203f; }
  table.vtable tbody tr.active { background: #1b2548; box-shadow: inset 3px 0 0 var(--accent); }
  .vt-title { color: var(--txt); max-width: 360px; }
  .vt-money { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rowbtn {
    background: none; border: none; color: var(--accent-2); cursor: pointer; font: inherit;
    font-variant-numeric: tabular-nums; padding: 0; text-align: left;
  }
  .rowbtn:hover { text-decoration: underline; }
  .sentinel { height: 1px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  footer { text-align: center; color: var(--grey); font-size: 12px; padding: 30px 0 50px; }
  .reset {
    background: none; border: 1px solid var(--line); color: var(--muted);
    border-radius: 9px; padding: 9px 12px; font-size: 13px; cursor: pointer;
  }
  .reset:hover { border-color: var(--red); color: var(--red); }
  @media (max-width: 720px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo" id="hubLogo">◎</div>
    <div style="flex:1 1 auto;min-width:0;">
      <h1 id="hubTitle">Solution Hub</h1>
      <div class="tag" id="hubTag">Pick a domain to explore 1,000 solutions.</div>
    </div>
    <label class="domain-picker">
      <span class="slider-label">Domain</span>
      <select id="domainSelect" aria-label="Choose a domain"></select>
    </label>
  </div>
</header>

<section class="stats" id="stats"></section>

<div class="controls">
  <div class="controls-inner">
    <input type="search" id="search" aria-label="Search solutions, subtasks, and categories" placeholder="Search 1,000 solutions, subtasks, categories…" />
    <select id="statusFilter" aria-label="Filter by status">
      <option value="">All statuses</option>
      <option value="todo">Has To-do</option>
      <option value="doing">Has In-progress</option>
      <option value="blocked">Has Blocked</option>
      <option value="done">Fully complete</option>
    </select>
    <select id="sort" aria-label="Sort solutions">
      <option value="id">Sort: Default</option>
      <option value="progress-asc">Progress: Low → High</option>
      <option value="progress-desc">Progress: High → Low</option>
      <option value="impact">Impact: High first</option>
      <option value="feasibility">Feasibility: High first</option>
      <option value="quickwins">Quick wins (impact × feasibility)</option>
      <option value="bizfeas">Business feasibility: High first</option>
      <option value="profit">Profit potential: High first</option>
      <option value="bizopp">Best business (biz × profit)</option>
    </select>
    <div class="viewtoggle" role="group" aria-label="View mode">
      <button type="button" id="viewCards" class="vt active" aria-pressed="true">▦ Cards</button>
      <button type="button" id="viewTable" class="vt" aria-pressed="false">▤ Table</button>
    </div>
    <button class="reset" id="exportJson">Export JSON</button>
    <button class="reset" id="exportCsv">Export CSV</button>
    <button class="reset" id="reset">Reset progress</button>
    <button class="reset" id="themeToggle" aria-pressed="false" title="Toggle light / dark theme">☀︎ Light</button>
    <span class="count" id="count"></span>
  </div>
  <div class="controls-inner" style="margin-top:10px;">
    <label class="slider-wrap">
      <span class="slider-label">Max cost</span>
      <input type="range" id="costSlider" min="0" max="100" value="100" step="1"
             aria-label="Maximum solution cost" aria-valuetext="Any" />
      <span class="slider-val" id="costSliderVal">Any</span>
    </label>
    <button class="reset" id="costClear" type="button" hidden>Clear cost</button>
  </div>
  <div class="controls-inner" style="margin-top:10px;">
    <div class="chiprow" id="cats"></div>
  </div>
</div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">No solutions match your filters.</div>
  <div class="sentinel" id="sentinel"></div>
</main>

<div class="backdrop" id="backdrop"></div>
<aside class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle" tabindex="-1"></aside>

<footer>VoltDown · Generated locally in your browser · Status changes saved to this device only.</footer>
<div id="srAnnounce" class="sr-only" role="status" aria-live="polite"></div>

<script>
/* ---------- Deterministic PRNG so generated data is stable across reloads ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function pick(rng, arr){ return arr[Math.floor(rng()*arr.length)]; }

/* ---------- Solution domain model ---------- */
const HUB_DOMAINS = [];
HUB_DOMAINS.push({
  key: "electricity",
  group: "Featured apps",
  name: "⚡ Electricity Prices",
  accent: "#ffd54a",
  tagline: "1,000 solutions to high electricity prices.",
  CATEGORIES: [
    { key: "Efficiency", name: "Home Energy Efficiency", color: "#4ad0ff", stems: [
      "Subsidize whole-home insulation upgrades",
      "Roll out free smart thermostats",
      "Mandate LED lighting retrofits",
      "Launch an appliance trade-in rebate",
      "Fund attic and wall air-sealing",
      "Require energy-efficient windows in renovations",
      "Offer free home energy audits",
      "Replace electric resistance water heaters with heat-pump units",
      "Incentivize Energy Star appliance purchases",
      "Deploy occupancy-based lighting controls",
      "Standardize energy labels on rentals",
      "Cut phantom standby loads with smart plugs"

  const v = n * USD_PHP;
  if (v >= 1e9) return "₱" + (v / 1e9).toFixed(v >= 1e10 ? 0 : 1) + "B";
  if (v >= 1e6) return "₱" + (v / 1e6).toFixed(v >= 1e7 ? 0 : 1) + "M";
  if (v >= 1e3) return "₱" + Math.round(v / 1e3) + "K";
  return "₱" + Math.round(v);
}
// "$X · ₱Y" dual-currency display used wherever a price is shown.
function money2(n) { return formatMoney(n) + " · " + formatPHP(n); }
function solCost(sol) { return sol.subs.reduce((a, s) => a + (s.cost || 0), 0); }
function feasBand(n) { return n >= 75 ? "High" : n >= 50 ? "Medium" : "Low"; }

  generic: [
    "Scope the problem and set a target",
    "Run a feasibility and cost-benefit study",
    "Identify and engage stakeholders",
    "Secure funding and approvals",
    "Design the program rules and eligibility",

// Comprehensive, ordered execution steps for any subtask. {t} = the subtask text.
const STEP_BANK = [
  "Clarify the objective and a clear definition of done",
  "Confirm how this supports the parent task: {t}",
  "Identify the owner, stakeholders, and approvers",
  "Break the work into concrete, sequenced tasks",
  "Estimate the effort, cost, and timeline",
  "Surface dependencies, risks, and likely blockers",
  "Gather the data, tools, permits, or vendors required",
  "Draft the detailed plan and circulate it for review",
  "Run a small pilot or dry run to de-risk the approach",
  "Execute the work and track progress against milestones",
  "Validate the results against the success metrics",
  "Communicate status and decisions to stakeholders",
  "Document the outcome and capture lessons learned",
  "Secure sign-off and formally close out this step"
];
// Deterministic per-subtask steps from an independent seed — does NOT touch the
// main generator's PRNG, so existing costs/statuses/feasibility stay unchanged.
function stepsFor(solId, subIdx, text) {
  const rng = mulberry32(((solId * 131) + (subIdx * 17) + 7) >>> 0);
  const n = 5 + Math.floor(rng() * 3); // 5..7 steps
  const pool = STEP_BANK.map((_, i) => i);
  const picked = [];
  while (picked.length < n && pool.length) picked.push(pool.splice(Math.floor(rng() * pool.length), 1)[0]);
  picked.sort((a, b) => a - b); // preserve the bank's logical order
  const t = text.charAt(0).toLowerCase() + text.slice(1);
  return picked.map(i => STEP_BANK[i].replace("{t}", t));
}

// Real organizations actively working in each category's space (illustrative,
// non-exhaustive, mapped at the CATEGORY level — not endorsements, not tied to a
// specific generated solution). Each links to a web search.
let COMPANIES = {};

const STATUSES = ["todo", "doing", "blocked", "done"];
const STATUS_LABEL = { todo: "To-do", doing: "In progress", blocked: "Blocked", done: "Done" };
const STATUS_NEXT = { todo: "doing", doing: "done", done: "blocked", blocked: "todo" };

/* ---------- Generate exactly 1000 solutions ---------- */
let TOTAL = 1000;
function generate() {
  const out = [];
  const seenTitles = new Set();
  let i = 0;
  // round-robin across categories so the list feels balanced
  let guard = 0;
  while (out.length < TOTAL && guard < 100000) {
    guard++;
    const cat = CATEGORIES[i % CATEGORIES.length];
    i++;
    const id = out.length + 1;
    const rng = mulberry32(id * 2654435761 + 12345 + DOMAIN_SALT);
    const stem = pick(rng, cat.stems);
    const scope = pick(rng, SCOPES);
    let title = scope ? `${stem} ${scope}` : stem;
    // ensure uniqueness; if collision, append a differentiator
    let title2 = title;
    let bump = 2;
    while (seenTitles.has(title2)) { title2 = `${title} (phase ${bump++})`; }
    seenTitles.add(title2);

    const impact = pick(rng, IMPACTS);
    const cost = pick(rng, COSTS);
    const nSubs = 3 + Math.floor(rng() * 3); // 3..5
    const bank = SUBTASK_BANK.generic.slice();
    const subs = [];
    for (let s = 0; s < nSubs; s++) {
      const idx = Math.floor(rng() * bank.length);
      const text = bank.splice(idx, 1)[0] || `Implementation step ${s + 1}`;
      // deterministic seeded default status, weighted toward not-done
      const r = rng();
      let st = "todo";
      if (r > 0.92) st = "done";
      else if (r > 0.78) st = "blocked";
      else if (r > 0.5) st = "doing";
      const [lo, hi] = COST_RANGE[cost];
      const subCost = Math.round((lo + rng() * (hi - lo)) / 500) * 500;
      subs.push({ text, status: st, cost: subCost });
    }
    // Illustrative seeded feasibility (35-99); computed after subs so costs/statuses are unchanged.
    const feasibility = 35 + Math.round(rng() * 64);
    // Business-conversion scores (illustrative): how viable as a business + profit potential.
    const bizFeasibility = 30 + Math.round(rng() * 69); // 30..99
    const profitScore = 25 + Math.round(rng() * 74);    // 25..99
    out.push({
      id,
      cat: cat.name,
      catKey: cat.key,
      color: cat.color,
      title: title2,
      impact,
      cost,
      feasibility,
      bizFeasibility,
      profitScore,
      subs
    });
  }
  return out;
}

let SOLUTIONS = [];
/* ---------- Multi-domain machinery ---------- */
let DOMAIN_SALT = 0;
let activeDomain = null, activeDomainKey = "";
const domainCache = {};
function hashKey(k){ let h = 2166136261 >>> 0; for (let i=0;i<k.length;i++){ h ^= k.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function buildDomain(d){
  CATEGORIES = d.CATEGORIES;
  SCOPES = (d.SCOPES && d.SCOPES.length) ? d.SCOPES : GENERIC_SCOPES;
  TOTAL = d.TOTAL || 1000;
  DOMAIN_SALT = hashKey(d.key);
  const sols = generate();
  let mn = Infinity, mx = 0;
  for (const so of sols){ const c = so.subs.reduce((a,x)=>a+(x.cost||0),0); if (c<mn) mn=c; if (c>mx) mx=c; }
  return { sols, mn, mx };
}
function switchDomain(key){
  const d = HUB_DOMAINS.find(x => x.key === key) || HUB_DOMAINS[0];
  if (!d) return;
  activeDomain = d; activeDomainKey = d.key;
  COMPANIES = d.COMPANIES || {};
  if (!domainCache[d.key]) domainCache[d.key] = buildDomain(d);
  CATEGORIES = d.CATEGORIES;
  SCOPES = (d.SCOPES && d.SCOPES.length) ? d.SCOPES : GENERIC_SCOPES;
  TOTAL = d.TOTAL || 1000;
  DOMAIN_SALT = hashKey(d.key);
  SOLUTIONS = domainCache[d.key].sols;
  COST_MIN = domainCache[d.key].mn; COST_MAX = domainCache[d.key].mx;
  activeCat = ""; searchQ = ""; statusFilter = ""; sortMode = "id";
  costMax = Infinity; chipsExpanded = false; renderLimit = 60;
  currentSolId = null; expandedSteps = new Set();
  const sv = document.getElementById("costSlider");
  if (sv){ sv.value = 100; document.getElementById("costSliderVal").textContent = "Any"; document.getElementById("costClear").hidden = true; }
  const se = document.getElementById("search"); if (se) se.value = "";
  const sf = document.getElementById("statusFilter"); if (sf) sf.value = "";
  const sortSel = document.getElementById("sort"); if (sortSel) sortSel.value = "id";
  updateBrand(d);
  renderChips(); renderStats(); setView("cards");
  const ds = document.getElementById("domainSelect"); if (ds && ds.value !== d.key) ds.value = d.key;
  window.scrollTo(0, 0);
}
function updateBrand(d){
  const logo = document.getElementById("hubLogo");
  if (logo) logo.style.background = "linear-gradient(135deg, " + d.accent + ", #ffffff33)";
  const t = document.getElementById("hubTitle"); if (t) t.textContent = d.name;
  const g = document.getElementById("hubTag"); if (g) g.textContent = d.tagline || "";
  document.documentElement.style.setProperty("--brand", d.accent);
  document.title = d.name + " — Solution Hub";
}
function buildDomainSwitcher(){
  const ds = document.getElementById("domainSelect"); if (!ds) return;
  const groups = {};
  for (const d of HUB_DOMAINS){ (groups[d.group] = groups[d.group] || []).push(d); }
  ds.innerHTML = Object.keys(groups).map(g =>
    '<optgroup label="' + g + '">' + groups[g].map(d => '<option value="' + d.key + '">' + d.name + "</option>").join("") + "</optgroup>"
  ).join("");
  ds.addEventListener("change", e => switchDomain(e.target.value));
}

/* ---------- Persistence ---------- */
const STORE_KEY = "voltdown_status_v1";
function loadOverrides() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); }
  catch { return {}; }
}
function saveOverrides(o) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(o)); } catch {}
}
let OVERRIDES = loadOverrides();

function subStatus(solId, subIdx, baseStatus) {
  const k = activeDomainKey + ":" + solId + ":" + subIdx;
  return (OVERRIDES[k] != null) ? OVERRIDES[k] : baseStatus;
}
function setSubStatus(solId, subIdx, status) {
  OVERRIDES[activeDomainKey + ":" + solId + ":" + subIdx] = status;
  saveOverrides(OVERRIDES);
}

/* ---------- Derived helpers ---------- */
function solStatuses(sol) {
  return sol.subs.map((s, idx) => subStatus(sol.id, idx, s.status));
}
function solProgress(sol) {
  const st = solStatuses(sol);
  const done = st.filter(x => x === "done").length;
  return { done, total: st.length, pct: Math.round((done / st.length) * 100), st };
}

let activeCat = "";       // category key filter
let searchQ = "";
let statusFilter = "";
let sortMode = "id";
let viewMode = "cards";   // "cards" | "table"
let renderLimit = 60;     // infinite-scroll batch

// Cost-filter domain (per-solution total cost). Log-scaled because costs are very skewed.
let COST_MIN = 0;
let COST_MAX = 1;
let costMax = Infinity;   // current "max cost" threshold; Infinity = show all
function sliderToCost(v) { // v: 0..100 → cost on a log scale
  return Math.round(COST_MIN * Math.pow(COST_MAX / COST_MIN, v / 100));
}

const grid = document.getElementById("grid");
const emptyEl = document.getElementById("empty");
const countEl = document.getElementById("count");

function matches(sol) {
  if (activeCat && sol.catKey !== activeCat) return false;
  if (costMax !== Infinity && solCost(sol) > costMax) return false;
  const { st } = solProgress(sol);
  if (statusFilter === "done" && !st.every(x => x === "done")) return false;
  if (statusFilter && statusFilter !== "done" && !st.includes(statusFilter)) return false;
  if (searchQ) {
    const hay = (sol.title + " " + sol.cat + " " + sol.subs.map(s => s.text).join(" ")).toLowerCase();
    if (!hay.includes(searchQ)) return false;
  }
  return true;
}

function filteredSorted() {
  let list = SOLUTIONS.filter(matches);
  if (sortMode === "progress-asc") list.sort((a, b) => solProgress(a).pct - solProgress(b).pct || a.id - b.id);
  else if (sortMode === "progress-desc") list.sort((a, b) => solProgress(b).pct - solProgress(a).pct || a.id - b.id);
  else if (sortMode === "impact") {
    const w = { High: 0, Medium: 1, Low: 2 };
    list.sort((a, b) => w[a.impact] - w[b.impact] || a.id - b.id);
  }
  else if (sortMode === "feasibility") list.sort((a, b) => b.feasibility - a.feasibility || a.id - b.id);
  else if (sortMode === "quickwins") {
    const iw = { High: 3, Medium: 2, Low: 1 };
    const q = s => iw[s.impact] * s.feasibility;
    list.sort((a, b) => q(b) - q(a) || a.id - b.id);
  }
  else if (sortMode === "bizfeas") list.sort((a, b) => b.bizFeasibility - a.bizFeasibility || a.id - b.id);
  else if (sortMode === "profit") list.sort((a, b) => b.profitScore - a.profitScore || a.id - b.id);
  else if (sortMode === "bizopp") list.sort((a, b) => (b.bizFeasibility * b.profitScore) - (a.bizFeasibility * a.profitScore) || a.id - b.id);
  return list;
}

function cardHTML(sol) {

  return `<div class="card${active}" data-id="${sol.id}" tabindex="0" role="button" aria-label="Open details for ${escapeHTML(sol.title)}">
    <div class="top">
      <span class="cat" style="color:${sol.color}">${escapeHTML(sol.cat)}</span>
      <span class="idtag">#${String(sol.id).padStart(4, "0")}</span>
    </div>
    <div class="title">${escapeHTML(sol.title)}</div>
    <div class="meta">
      <span class="pill impact-${sol.impact}">${sol.impact} impact</span>
      <span class="pill feas-${feasBand(sol.feasibility)}" title="Feasibility ${sol.feasibility}/100 — illustrative">${sol.feasibility} feasibility</span>
      <span class="pill cost" title="${COST_TIER_LABEL[sol.cost]} — illustrative · ≈₱${toPHP(solCost(sol)).toLocaleString()}">${money2(solCost(sol))}</span>
      <div class="progress-mini" role="progressbar" aria-valuenow="${p.pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${p.done} of ${p.total} subtasks done"><span style="width:${p.pct}%"></span></div>
      <span class="idtag">${p.done}/${p.total}</span>

    <div class="cardhint">${sol.subs.length} subtasks · click for details ›</div>
  </div>`;
}

function escapeHTML(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function tableHTML(list) {
  const head = `<thead><tr>
    <th scope="col">#</th><th scope="col">Category</th><th scope="col">Solution</th>
    <th scope="col">Impact</th><th scope="col">Feas.</th>
    <th scope="col">💼 Biz</th><th scope="col">💰 Profit</th>
    <th scope="col">Est. cost (USD)</th><th scope="col">Est. cost (PHP)</th>
    <th scope="col">Subtasks</th><th scope="col">Progress</th>
  </tr></thead>`;
  const body = list.map(sol => {
    const p = solProgress(sol);
    const active = currentSolId === sol.id ? " class=\"active\"" : "";
    return `<tr data-id="${sol.id}"${active}>
      <th scope="row"><button type="button" class="rowbtn" data-id="${sol.id}" aria-label="Open details for ${escapeHTML(sol.title)}">#${String(sol.id).padStart(4, "0")}</button></th>
      <td class="vt-cat" style="color:${sol.color}">${escapeHTML(sol.cat)}</td>
      <td class="vt-title">${escapeHTML(sol.title)}</td>
      <td><span class="pill impact-${sol.impact}">${sol.impact}</span></td>
      <td>${sol.feasibility}</td>
      <td>${sol.bizFeasibility}</td>
      <td>${sol.profitScore}</td>
      <td class="vt-money">${formatMoney(solCost(sol))}</td>
      <td class="vt-money">${formatPHP(solCost(sol))}</td>
      <td>${sol.subs.length}</td>
      <td>${p.done}/${p.total} · ${p.pct}%</td>
    </tr>`;
  }).join("");
  return `<table class="vtable">${head}<tbody>${body}</tbody></table>`;
}

function render() {
  const list = filteredSorted();
  countEl.textContent = `${list.length.toLocaleString()} of ${TOTAL.toLocaleString()} shown`;
  const slice = list.slice(0, renderLimit);
  if (viewMode === "table") {
    grid.className = "tablewrap";
    grid.innerHTML = tableHTML(slice);
  } else {
    grid.className = "grid";
    grid.innerHTML = slice.map(cardHTML).join("");
  }
  emptyEl.style.display = list.length === 0 ? "block" : "none";
  window._fullCount = list.length;
}

/* ---------- Stats ---------- */
function renderStats() {
  let subTotal = 0, done = 0, doing = 0, blocked = 0, todo = 0, fullyDone = 0;
  for (const sol of SOLUTIONS) {
    const st = solStatuses(sol);
    subTotal += st.length;
    let allDone = true;
    for (const s of st) {
      if (s === "done") done++; else allDone = false;
      if (s === "doing") doing++;
      if (s === "blocked") blocked++;
      if (s === "todo") todo++;
    }
    if (allDone) fullyDone++;
  }
  const pct = Math.round((done / subTotal) * 100);
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="n">${TOTAL.toLocaleString()}</div><div class="l">Solutions</div></div>
    <div class="stat"><div class="n">${subTotal.toLocaleString()}</div><div class="l">Subtasks</div></div>
    <div class="stat"><div class="n">${fullyDone.toLocaleString()}</div><div class="l">Fully complete</div></div>
    <div class="stat"><div class="n">${pct}%</div><div class="l">Subtasks done</div>
      <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${pct}% of all subtasks done">
        <span style="width:${done/subTotal*100}%;background:var(--green)"></span>
        <span style="width:${doing/subTotal*100}%;background:var(--amber)"></span>
        <span style="width:${blocked/subTotal*100}%;background:var(--red)"></span>
        <span style="width:${todo/subTotal*100}%;background:var(--grey)"></span>
      </div>
    </div>
    <div class="stat"><div class="n">${blocked.toLocaleString()}</div><div class="l">Blocked subtasks</div></div>`;
}

/* ---------- Category chips ---------- */
const CHIP_COLLAPSED = 6;   // how many category chips to show before "See more"
let chipsExpanded = false;
function chipHTML(key, label, count) {
  return `<button type="button" class="chip ${activeCat === key ? "active" : ""}" data-cat="${key}" aria-pressed="${activeCat === key}">${label} (${count})</button>`;
}
function renderChips() {
  const counts = {};
  for (const s of SOLUTIONS) counts[s.catKey] = (counts[s.catKey] || 0) + 1;
  const el = document.getElementById("cats");
  let html = chipHTML("", "All", TOTAL);
  const collapsible = CATEGORIES.length > CHIP_COLLAPSED;
  let cats = (!chipsExpanded && collapsible) ? CATEGORIES.slice(0, CHIP_COLLAPSED) : CATEGORIES;
  // keep the active category visible even when collapsed
  if (!chipsExpanded && collapsible && activeCat && !cats.some(c => c.key === activeCat)) {
    const ac = CATEGORIES.find(c => c.key === activeCat);
    if (ac) cats = cats.concat(ac);
  }
  html += cats.map(c => chipHTML(c.key, c.name, counts[c.key] || 0)).join("");
  if (collapsible) {
    const hidden = CATEGORIES.length - CHIP_COLLAPSED;
    html += chipsExpanded
      ? `<button type="button" class="chip chip-toggle" data-action="toggle-chips" aria-expanded="true">See less ▴</button>`
      : `<button type="button" class="chip chip-toggle" data-action="toggle-chips" aria-expanded="false">See more (${hidden}) ▾</button>`;
  }
  el.innerHTML = html;
}

function applyCostSlider() {
  const v = +costSlider.value;
  if (v >= 100) {
    costMax = Infinity;
    costSliderVal.textContent = "Any";
    costSlider.setAttribute("aria-valuetext", "Any");

    costSlider.setAttribute("aria-valuetext", label);
    costClear.hidden = false;

}

function download(filename, text, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

  const cols = ["solution_id", "category", "solution", "impact", "feasibility", "feasibility_band", "business_feasibility", "profit_potential", "cost_tier", "solution_est_cost_usd", "solution_est_cost_php", "subtask_index", "subtask", "subtask_est_cost_usd", "subtask_est_cost_php", "status"];
  const esc = v => `"${String(v).replace(/"/g, '""')}"`;
  const csv = [cols.join(",")].concat(rows.map(r => cols.map(c => esc(r[c])).join(","))).join("\r\n");
  download("voltdown-solutions.csv", csv, "text/csv");
});
document.getElementById("reset").addEventListener("click", () => {
  if (confirm("Reset all status changes saved on this device?")) {
    OVERRIDES = Object.fromEntries(Object.entries(OVERRIDES).filter(([k]) => !k.startsWith(activeDomainKey + ":"))); saveOverrides(OVERRIDES); render(); renderStats();
  }
});

/* ---------- Master–detail panel ---------- */
let currentSolId = null;
let expandedSteps = new Set();   // subtask indices whose steps are expanded in the open panel
const detail = document.getElementById("detail");
const backdrop = document.getElementById("backdrop");

let lastTrigger = null;
function setBackgroundInert(on) {
  ["header", ".stats", ".controls", "main"].forEach(sel => {
    const elx = document.querySelector(sel);
    if (!elx) return;
    if (on) { elx.setAttribute("inert", ""); elx.setAttribute("aria-hidden", "true"); }
    else { elx.removeAttribute("inert"); elx.removeAttribute("aria-hidden"); }
  });
}
// active highlight works in either view (.card or table tr)
function highlightEl(id) { return grid.querySelector(`.card[data-id="${id}"], tr[data-id="${id}"]`); }
const mqMobile = window.matchMedia("(max-width: 760px)");
function openDetail(solId) {
  const prev = currentSolId;
  lastTrigger = grid.querySelector(`.card[data-id="${solId}"]`) || document.activeElement;
  if (solId !== prev) expandedSteps = new Set(); // reset step expansion when switching solutions
  currentSolId = solId;
  renderDetail();
  detail.classList.add("open");
  document.body.classList.add("detail-open");
  // refresh active highlight on the open item (card or table row)
  if (prev) { const pc = highlightEl(prev); if (pc) pc.classList.remove("active"); }
  const cc = highlightEl(solId); if (cc) cc.classList.add("active");
  detail.scrollTop = 0;
  // On mobile the panel is a full-screen modal drawer (dim + trap focus). On desktop it's a
  // non-modal docked split, so the table stays interactive and re-flows into the freed space.
  const modal = mqMobile.matches;
  detail.setAttribute("aria-modal", modal ? "true" : "false");
  if (modal) { backdrop.classList.add("open"); setBackgroundInert(true); }
  else { backdrop.classList.remove("open"); setBackgroundInert(false); }
  const closeBtn = document.getElementById("detailClose");
  if (closeBtn) closeBtn.focus();
}
function closeDetail() {
  if (!currentSolId && !detail.classList.contains("open")) return;
  detail.classList.remove("open");
  backdrop.classList.remove("open");
  document.body.classList.remove("detail-open");
  const activeEl = currentSolId ? highlightEl(currentSolId) : null;
  if (activeEl) activeEl.classList.remove("active");
  currentSolId = null;
  setBackgroundInert(false); // un-inert before returning focus
  const target = lastTrigger || activeEl;
  if (target && target.focus) target.focus();
  lastTrigger = null;
}

// Seeded duration (weeks) for a subtask — independent seed, doesn't perturb other data.
function taskWeeks(solId, subIdx) {
  const rng = mulberry32(((solId * 977) + (subIdx * 61) + 3) >>> 0);
  return 2 + Math.floor(rng() * 11); // 2..12 weeks
}
function timelineHTML(sol) {
  const p = solProgress(sol);
  let start = 0;
  const phases = sol.subs.map((s, idx) => {
    const dur = taskWeeks(sol.id, idx);
    const ph = { idx, start, dur, st: p.st[idx], text: s.text };
    start += dur;
    return ph;
  });
  const totalW = start || 1;
  const months = Math.round((totalW / 4.345) * 10) / 10;
  const rows = phases.map(ph =>
    `<div class="tl-row">
      <span class="tl-label" title="${escapeHTML(ph.text)}">${escapeHTML(ph.text)}</span>
      <div class="tl-track">
        <div class="tl-bar s-${ph.st}" style="left:${(ph.start / totalW) * 100}%;width:${(ph.dur / totalW) * 100}%"
             title="${escapeHTML(ph.text)} — weeks ${ph.start + 1}–${ph.start + ph.dur}">${ph.dur}w</div>
      </div>
    </div>`).join("");
  return `<div class="tl-total">Sequential plan: <b>${totalW} weeks</b> (~${months} months) across ${phases.length} tasks.</div>
    <div class="timeline">${rows}<div class="tl-axis"><span>Week 1</span><span>Week ${totalW}</span></div></div>`;
}
function renderDetail() {
  if (!currentSolId) return;
  const sol = SOLUTIONS[currentSolId - 1];
  const p = solProgress(sol);
  const total = solCost(sol);
  const rows = sol.subs.map((s, idx) => {
    const st = p.st[idx];
    const steps = stepsFor(sol.id, idx, s.text);
    const open = expandedSteps.has(idx);
    const stepsList = `<ol class="dsteps"${open ? "" : " hidden"}>${steps.map(x => `<li>${escapeHTML(x)}</li>`).join("")}</ol>`;
    return `<div class="dsub ${st === "done" ? "done" : ""}">
      <div class="dsub-row">
        <div class="dsub-main">
          <span class="dsub-txt">${escapeHTML(s.text)}</span>
          <span class="dsub-cost" title="Illustrative cost estimate (USD · PHP)">${money2(s.cost)}</span>
        </div>
        <button class="status-btn s-${st}" data-sub="${idx}">${STATUS_LABEL[st]}</button>
      </div>
      <button class="steps-toggle" data-steps="${idx}" aria-expanded="${open}">${open ? "▾" : "▸"} ${steps.length} steps</button>
      ${stepsList}
    </div>`;
  }).join("");
  detail.innerHTML = `
    <div class="detail-head">
      <span class="cat" style="color:${sol.color}">${escapeHTML(sol.cat)}</span>
      <button class="detail-close" id="detailClose" aria-label="Close details">✕</button>
    </div>
    <div class="detail-id">Solution #${String(sol.id).padStart(4, "0")}</div>
    <h2 class="detail-title" id="detailTitle">${escapeHTML(sol.title)}</h2>
    <div class="meta">
      <span class="pill impact-${sol.impact}">${sol.impact} impact</span>
      <span class="pill feas-${feasBand(sol.feasibility)}" title="Feasibility ${sol.feasibility}/100">${feasBand(sol.feasibility)} feasibility</span>
      <span class="pill cost" title="${COST_TIER_LABEL[sol.cost]} — illustrative">${COST_TIER_LABEL[sol.cost]}</span>
    </div>
    <div class="detail-cost">
      <div><div class="dc-n">${formatMoney(total)}<span class="dc-sub"> · ${formatPHP(total)}</span></div><div class="dc-l">Est. total cost (USD · PHP)</div></div>
      <div><div class="dc-n">${sol.feasibility}<span class="dc-sub">/100</span></div><div class="dc-l">Feasibility</div></div>
      <div><div class="dc-n">${sol.bizFeasibility}<span class="dc-sub">/100</span></div><div class="dc-l">💼 Business feasibility</div></div>
      <div><div class="dc-n">${sol.profitScore}<span class="dc-sub">/100</span></div><div class="dc-l">💰 Profit potential</div></div>
      <div><div class="dc-n">${p.done}/${p.total}</div><div class="dc-l">Subtasks done</div></div>
      <div><div class="dc-n">${p.pct}%</div><div class="dc-l">Complete</div></div>
    </div>
    <div class="progress-mini detail-prog" role="progressbar" aria-valuenow="${p.pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${p.pct}% complete, ${p.done} of ${p.total} subtasks done"><span style="width:${p.pct}%"></span></div>
    <div class="detail-sec">Subtasks &amp; cost per task</div>
    <div class="dsubs">${rows}</div>
    <div class="detail-sec">Timeline</div>
    ${timelineHTML(sol)}
    <div class="detail-sec">Who's working on this</div>
    <div class="orgs">${(COMPANIES[sol.catKey] || []).map(name => {
      const q = name.replace(/\s*\([^)]*\)\s*/g, " ").trim();      // drop parenthetical notes
      const href = "https://duckduckgo.com/?q=" + encodeURIComponent("\\" + q); // \ = jump to top result (official site)
      return `<a class="org" href="${href}" target="_blank" rel="noopener">${escapeHTML(name)} ↗</a>`;
    }).join("")}</div>
    <p class="detail-note">Cost figures, statuses, and the impact / feasibility / business-feasibility / profit-potential scores are illustrative seeded estimates, not sourced data or financial advice. PHP (₱) amounts are converted at an approximate ${USD_PHP} ₱/$ rate — not a live quote. The organizations above are real companies/institutions active in the <strong>${escapeHTML(sol.cat)}</strong> space — listed at the category level as illustrative, non-exhaustive examples (not endorsements, not tied to this specific solution). Click a status to advance it (To-do → In progress → Done → Blocked).</p>`;
}

function cycleSub(solId, subIdx) {
  const sol = SOLUTIONS[solId - 1];
  const cur = subStatus(solId, subIdx, sol.subs[subIdx].status);
  const next = STATUS_NEXT[cur];
  setSubStatus(solId, subIdx, next);
  // announce the change for screen readers
  const ann = document.getElementById("srAnnounce");
  if (ann) ann.textContent = `${sol.subs[subIdx].text} set to ${STATUS_LABEL[next]}`;
  // update the card's mini progress in the grid
  const card = grid.querySelector(`.card[data-id="${solId}"]`);
  if (card) {
    const p = solProgress(sol);
    card.querySelector(".progress-mini > span").style.width = p.pct + "%";
    card.querySelector(".meta .idtag").textContent = `${p.done}/${p.total}`;
  }
  renderStats();
  // Re-render when membership/order/row-cells depend on the change (filters, progress sorts, or table view).
  if (statusFilter || sortMode === "progress-asc" || sortMode === "progress-desc" || viewMode === "table") render();
}

// Clicking a card (or a table row) opens its detail panel
grid.addEventListener("click", e => {
  const el = e.target.closest(".card, tr[data-id]");
  if (el) openDetail(+el.dataset.id);
});
grid.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") {
    const card = e.target.closest(".card");
    if (card) { e.preventDefault(); openDetail(+card.dataset.id); }
  }
});

// Status changes, steps expand/collapse, and close — inside the detail panel
detail.addEventListener("click", e => {
  if (e.target.closest("#detailClose")) { closeDetail(); return; }
  const steps = e.target.closest(".steps-toggle");
  if (steps) {
    const idx = +steps.dataset.steps;
    if (expandedSteps.has(idx)) expandedSteps.delete(idx); else expandedSteps.add(idx);
    renderDetail();
    return;
  }
  const btn = e.target.closest(".status-btn");
  if (btn && currentSolId) {
    cycleSub(currentSolId, +btn.dataset.sub);
    renderDetail();
  }
});
backdrop.addEventListener("click", closeDetail);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });

/* ---------- Infinite scroll ---------- */
const sentinel = document.getElementById("sentinel");
new IntersectionObserver(entries => {
  if (entries[0].isIntersecting && renderLimit < (window._fullCount || 0)) {
    renderLimit += 60; render();
  }
}, { rootMargin: "600px" }).observe(sentinel);

/* ---------- Theme (light / dark) ---------- */
const THEME_KEY = "voltdown_theme";
const themeToggle = document.getElementById("themeToggle");
function applyTheme(theme) {
  const light = theme === "light";
  document.documentElement.setAttribute("data-theme", light ? "light" : "");
  themeToggle.textContent = light ? "☾ Dark" : "☀︎ Light";
  themeToggle.setAttribute("aria-pressed", String(light));
}
function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch {}
  applyTheme(saved || "dark");
}
themeToggle.addEventListener("click", () => {
  const light = document.documentElement.getAttribute("data-theme") !== "light";
  applyTheme(light ? "light" : "dark");
  try { localStorage.setItem(THEME_KEY, light ? "light" : "dark"); } catch {}
});

/* ---------- Init ---------- */
initTheme();
buildDomainSwitcher();
switchDomain(HUB_DOMAINS[0] && HUB_DOMAINS[0].key);
</script>
</body>
</html>
